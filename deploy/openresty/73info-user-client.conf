# OpenResty / Nginx SPA fallback for user-client history mode.
# Put the location rules into the active 73info.cn server block, then reload OpenResty.

# Shared zones for basic anti-CC controls.
limit_req_zone $binary_remote_addr zone=perip_req:20m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip_conn:20m;

server {
    listen 80;
    server_name 73info.cn www.73info.cn;

    root /www/wwwroot/73info.cn;
    index index.html;
    error_page 404 /404.html;

    set $site_csp "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; frame-src 'self' https://openapi.alipay.com https://excashier.alipay.com https://unitradeprod.alipay.com; media-src 'self' blob:; img-src 'self' https: data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://api.73info.cn https://dev.73info.cn";

    client_max_body_size 20m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    limit_req zone=perip_req burst=60 nodelay;
    limit_conn perip_conn 40;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $site_csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /404.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $site_csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # If this same virtual host also proxies backend routes, put those
    # locations above the SPA fallback.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /r/ {
        limit_req zone=perip_req burst=30 nodelay;
        limit_conn perip_conn 20;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Required for Vue Router history mode. `$uri.html` lets crawlers receive
    # route-specific static SEO entry pages such as /community.html for /community.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Content-Security-Policy $site_csp always;
        add_header X-Content-Type-Options nosniff always;
    }
}
