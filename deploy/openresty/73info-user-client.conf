# OpenResty / Nginx SPA fallback for user_client history mode.
# Put the location rules into the active 73info.cn server block, then reload OpenResty.

# Shared zones for basic anti-CC controls.
limit_req_zone $binary_remote_addr zone=perip_req:20m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip_conn:20m;

# 主站只认裸域。`www.73info.cn` 交给下面那个 server 块 301 到裸域：
# 两个域名都回 200 会让爬虫把它们当成两份重复内容（虽然 canonical 指向裸域，但那只是提示）。
#
# 443 端口上的同一件事要在 1Panel 的站点配置里改：把 www 的 HTTPS server 块改成
#   server { listen 443 ssl http2; server_name www.73info.cn; ... }
#   # 只保留证书指令，位置一律 301：
#   return 301 https://73info.cn$request_uri;
# 并确认 www 的证书里含这两个域名（否则先跳再握手失败）。
server {
    listen 80;
    server_name www.73info.cn;

    return 301 https://73info.cn$request_uri;
}

server {
    listen 80;
    server_name 73info.cn;

    root /www/wwwroot/73info.cn;
    index index.html;
    error_page 404 /404.html;

    set $site_csp "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; frame-src 'self' https://openapi.alipay.com https://excashier.alipay.com https://unitradeprod.alipay.com https://challenges.cloudflare.com; media-src 'self' blob:; img-src 'self' https: data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; connect-src 'self' https://api.73info.cn https://dev.73info.cn https://challenges.cloudflare.com";

    client_max_body_size 20m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    limit_req zone=perip_req burst=60 nodelay;
    limit_conn perip_conn 40;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $site_csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /404.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $site_csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA 兜底外壳（构建期生成，robots=noindex）。地址本身不该被收录，
    # 也不该被缓存：它跟着构建走，改版后要立刻生效。
    location = /spa-fallback.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $site_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # If this same virtual host also proxies backend routes, put those
    # locations above the SPA fallback.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /r/ {
        limit_req zone=perip_req burst=30 nodelay;
        limit_conn perip_conn 20;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Required for Vue Router history mode. `$uri.html` lets crawlers receive
    # route-specific static SEO entry pages such as /community.html for /community.
    #
    # 兜底**不能**写 /index.html：构建期已经把 index.html 覆盖成首页快照，
    # 于是任何未命中快照的地址（过期链接、删掉的资源、前端通配路由的猜测地址）
    # 都会返回一份 200 的首页副本。改成构建期另外生成的 spa-fallback.html：
    # 它是同一套 SPA 外壳，但 robots 是 noindex，未命中地址不进索引、也不再和首页重复。
    #
    # 这里**不要**改成「匹配不到就 404」：前端路由 `/:rootSlug/:entrySlug?` 把任意
    # 一段 / 两段路径都当成「开发者目录页」，真正的 404 只能由前端渲染（NotFoundView
    # 会写 robots=noindex）。服务端写白名单会把新建开发者主页一起 404 掉。
    location / {
        try_files $uri $uri.html $uri/ /spa-fallback.html;
        add_header Content-Security-Policy $site_csp always;
        add_header X-Content-Type-Options nosniff always;
    }
}
