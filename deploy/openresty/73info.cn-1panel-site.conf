# 73info.cn 生产站点（1Panel）配置文件 —— SEO 修复版
#
# 用法：把本文件内容贴进 1Panel 里 73info.cn 站点的「配置文件」，保存后 reload OpenResty。
# 它是在**线上正在跑的那份 server 块**上改的：改动处标了「改」/「加」，其余原样保留。
#
# 不要直接照抄仓库里另一份 deploy/openresty/73info-user-client.conf，三处对不上线上：
#   1. 它的 root 写 /www/wwwroot/73info.cn，而线上实际生效的是 /www/sites/73info.cn/index（已核对）；
#   2. 它建议在 try_files 里加 $uri.html —— dist 里每个快照同时有 /x.html 与 /x/index.html 两份，
#      加了 $uri.html 会让 /x 直接返回 200，丢掉「/x 301 到 /x/」这条与 sitemap/canonical 一致的收敛；
#   3. 它建议 /assets/ 缓存 30 天 immutable —— 但 vite.config.ts 故意不哈希文件名
#      （entryFileNames: 'assets/[name].js'，线上就是 /assets/index.js），长缓存会让改版后的 JS 卡在浏览器里。
#
# 本次修的 4 件事，按影响从大到小：
#   1) 【主因】未命中静态快照的地址，兜底从 /index.html 换成 /spa-fallback.html。
#      index.html 已被构建期替换成「首页快照」，于是任意不存在的地址都返回一份 200 的首页副本，
#      而且那份副本自带 canonical 指向首页 —— 软 404 堆成一片，这是「收录质量不行」的直接来源。
#      spa-fallback.html 是同一个 SPA 外壳（/assets/index.js、/assets/style.css、#app 都一样），
#      只是 robots=noindex、且没有 canonical，所以页面照旧能打开，未命中地址不再进索引。
#   2) www / dev 不再与主域同时返回 200，统一 301 到 https://73info.cn。
#      同一份内容挂多个域名，Google 有跨域 canonical 兜着，百度的跨域 canonical 处理不如 Google 可靠，
#      而本站在做百度收录（public/baidu_verify_*.html、scripts/submit-baidu.mjs）。
#   3) /404.html 自己以前能以 200 被收录（文件里没有 robots meta），给它补 X-Robots-Tag。
#   4) 【次要】每个快照的 .html 孪生副本 301 到目录形态，收敛重复 URL。
#
# 改完自测（三条都应输出注释里的结果）：
#   curl -sS -o /dev/null -w "%{http_code} %{size_download}\n" https://73info.cn/no-such-page-xyz/
#     -> 200 7222            未命中地址拿到 noindex 外壳（现在是 200 18723，即首页副本）
#   curl -sSI https://www.73info.cn/ | head -1
#     -> HTTP/1.1 301         www 不再回 200
#   curl -sS -o /dev/null -w "%{http_code} %{redirect_url}\n" https://73info.cn/free-resources.html
#     -> 301 https://73info.cn/free-resources/

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    # 改：www 与 dev 已由下面那个 server 块 301 过来，这里不再声明。
    # 裸 IP 继续留着：没有对外链接指向它，爬虫基本发现不了；要彻底关掉见文件末尾。
    server_name 73info.cn 124.220.110.125;

    # 改：去掉 index.php —— 本站不跑 PHP，留着只是让落到根目录的 .php 有被执行或被当源码下载的可能。
    index index.html index.htm;

    access_log /www/sites/73info.cn/log/access.log main;
    error_log /www/sites/73info.cn/log/error.log;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    root /www/sites/73info.cn/index;

    error_page 404 /404.html;

    http2 on;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/73info.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/73info.cn/ssl/privkey.pem;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;

    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    error_page 497 https://$host$request_uri;

    proxy_set_header X-Forwarded-Proto https;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    # 允许跨域前端读取下载响应中的原始文件名
    add_header Access-Control-Expose-Headers "Content-Disposition" always;

    # 维护模式
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        try_files $uri =404;
    }

    location = /maintenance.on {
        return 404;
    }

    # 加：SPA 兜底外壳，未命中地址回落到它。
    # expires -1 就是 Cache-Control: no-cache，且它不走 add_header —— 这个 location 因此不会
    # 因为「自己的 add_header」把 server 级的 HSTS 等响应头挤掉（nginx 的 add_header 是覆盖式继承）。
    # noindex 写在文件自身的 <meta name="robots"> 里，够用。
    location = /spa-fallback.html {
        try_files $uri =404;
        expires -1;
    }

    # 加：404 页本身不该被收录。
    # 注意：下面这行 add_header 会让本 location 不再继承 server 级响应头（HSTS / Expose-Headers），
    # 对一张 404 页无所谓；别把这种写法随手搬到正常页面的 location 上。
    location = /404.html {
        try_files $uri =404;
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # API 反向代理到后端，包含 WebSocket
    location /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 加（次要）：同一页的 .html 孪生副本 301 到目录形态，只留一份 URL。
    # 带 -f 判断「同名目录里确实有 index.html」才跳，所以百度校验文件
    # （/baidu_verify_codeva-*.html）与 /spa-fallback.html、/404.html 都不受影响。
    location ~ ^/(?!.*\.\.)(.+?)\.html$ {
        if (-f $document_root/$1/index.html) {
            return 301 https://73info.cn/$1/;
        }

        try_files $uri =404;
    }

    location / {
        if (-f $document_root/maintenance.on) {
            return 503;
        }

        # 改：兜底从 /index.html 换成 noindex 外壳。
        # /index.html 现在是「首页快照」，拿它兜底等于让每个不存在的地址都返回一份 200 的首页副本。
        # 这里也**不要**补 $uri.html：那会让 /x 直接 200，丢掉与 sitemap/canonical 一致的 /x/ 收敛。
        # 目录请求（含 / 与 /free-resources/）仍由 index 指令交给各自的 index.html，不受本行影响。
        try_files $uri $uri/ /spa-fallback.html;
    }

    location ~ .*\.(js|css|png|jpg|jpeg|gif|webp|webm|avif|ico|bmp|swf|eot|svg|ttf|woff|woff2)$ {
        expires 5m;
        access_log off;
        log_not_found off;

        valid_referers none 73info.cn www.73info.cn dev.73info.cn 124.220.110.125;

        if ($invalid_referer) {
            access_log off;
            return 404;
        }
    }
}

# 加：www 与 dev 只做 301，不再与主域同时返回 200（同一份内容一套 URL 就够）。
# 两个域名的证书都由上面那个站的 fullchain.pem 覆盖（已核对：直连这两个域名 TLS 校验通过 verify=0）。
# 这个块放在主块**之后**：主块仍是本端口组的默认 server，未知 Host 的请求行为与今天完全一致。
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.73info.cn dev.73info.cn;

    ssl_certificate /www/sites/73info.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/73info.cn/ssl/privkey.pem;

    return 301 https://73info.cn$request_uri;
}

# 要把裸 IP 也关掉的话：把主块 server_name 里的 124.220.110.125 删掉、加到上面这个块里即可
# （HTTP 访问会 301 到 https://73info.cn；走 HTTPS 访问 IP 本来就会证书告警）。
# 前提是确认没有测试流量在用 IP 当 Host 访问本站。
