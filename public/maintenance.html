<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>73Info 柒叁信息 - 维护中</title>
    <style>
      :root {
        --brand: #1a237e;
        --brand-soft: #e8eaf6;
        --text: #334155;
        --text-sub: #64748b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        background: linear-gradient(160deg, #eef1fb 0%, #f8fafc 55%, #eef1fb 100%);
        color: var(--text);
        padding: 24px;
      }
      .card {
        max-width: 460px;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid rgba(26, 35, 126, 0.08);
        border-radius: 24px;
        padding: 48px 40px;
        box-shadow:
          0 24px 60px rgba(26, 35, 126, 0.12),
          0 4px 16px rgba(26, 35, 126, 0.06);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        margin-bottom: 24px;
        filter: drop-shadow(0 12px 24px rgba(69, 123, 191, 0.32));
      }
      .logo img {
        width: 100%;
        height: 100%;
        display: block;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--brand);
        margin-bottom: 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: var(--text-sub);
        margin-bottom: 6px;
      }
      .badge {
        display: inline-block;
        margin-top: 20px;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f59e0b;
        margin-right: 7px;
        vertical-align: 1px;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.72);
        }
      }
      footer {
        margin-top: 28px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo"><img src="/favicon.svg" alt="73Info" /></div>
      <h1>73Info 柒叁信息</h1>
      <p>站点正在维护中，暂时无法访问。</p>
      <p>我们正在优化服务，请稍后再来。</p>
      <div class="badge"><span class="dot"></span>维护中 · 敬请期待</div>
      <footer>73Info · 资源与需求协作平台</footer>
    </main>
  </body>
</html>
