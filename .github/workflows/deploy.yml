name: deploy

# 打 tag 发布，例如 v1.0.1-20261019。**tag 一律打在 master 上**：
# 本仓只有 master 基线，不要从其他分支打 tag 发布。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要部署的 tag（留空则用当前分支）'
        required: false
      rollback_to:
        description: '只回滚到某个已部署过的版本（填了就只切换，不构建）'
        required: false
      build_only:
        description: '只验证构建，不部署（填 true）'
        required: false

# 同一站点不允许并发布，否则两次切换会互相踩
concurrency:
  group: deploy-73info-cn
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    if: ${{ !inputs.rollback_to }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  deploy:
    needs: gate
    if: ${{ !inputs.rollback_to }}
    runs-on: ubuntu-latest
    steps:
      # 本仓的 ui_73info / tags-wasm 都是 link:/file: 的兄弟依赖，
      # 三个仓要检出成兄弟目录，路径关系与本地 /home/banch/dev73info 一致。
      - name: 取本仓
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: user_client

      - name: 取 ui_73info
        uses: actions/checkout@v4
        with:
          repository: dev73info/ui_73info
          token: ${{ secrets.DEPLOY_PAT }}
          path: ui_73info

      - name: 取 tags-wasm
        uses: actions/checkout@v4
        with:
          repository: dev73info/tags-wasm
          token: ${{ secrets.DEPLOY_PAT }}
          path: tags-wasm

      - name: 装 Rust wasm 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: 构建 tags-wasm
        working-directory: tags-wasm
        run: wasm-pack build --target web

      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: user_client/pnpm-lock.yaml

      # ui_73info 发的是源码、被 link 进宿主，但它自己的 vue 是 devDependency，
      # 不装的话宿主构建时从 ui_73info 的真实路径解析不到 vue。
      - name: 装 ui_73info 依赖
        working-directory: ui_73info
        run: pnpm install --frozen-lockfile

      - name: 装依赖
        working-directory: user_client
        run: pnpm install --frozen-lockfile

      - name: 构建
        working-directory: user_client
        run: pnpm build

      - name: 构建产物自检
        if: ${{ inputs.build_only }}
        working-directory: user_client
        run: |
          test -f dist/index.html
          ls -1 dist/assets | head -5
          echo "首页引用的资源："
          grep -oE '/assets/[A-Za-z0-9._~-]+\.(js|css)' dist/index.html | sort -u | head -5
          echo "构建验证完成，未部署"

      - name: 准备 SSH
        if: ${{ !inputs.build_only }}
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 部署并探活
        if: ${{ !inputs.build_only }}
        working-directory: user_client
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY_FILE: /home/runner/.ssh/deploy_key
          SITE: 73info.cn
          PUBLIC_URL: https://73info.cn
          RELEASE: ${{ inputs.tag || github.ref_name }}
        run: bash deploy/deploy-frontend.sh

  rollback:
    if: ${{ inputs.rollback_to }}
    runs-on: ubuntu-latest
    steps:
      - name: 准备 SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: 回滚
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET: ${{ inputs.rollback_to }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "sudo -n /usr/local/bin/73info-switch-frontend 73info.cn '$TARGET'"
          for ATTEMPT in 1 2 3; do
            if STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 https://73info.cn/); then
              echo "回滚后首页（第 $ATTEMPT 次）：HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                exit 0
              fi
            else
              CURL_EXIT=$?
              echo "回滚后首页第 $ATTEMPT 次请求发生 curl 网络/传输错误（exit $CURL_EXIT）。" >&2
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "回滚后首页检查失败：最多重试 3 次，且只有 HTTP 200 才算成功。" >&2
          exit 1

  notify:
    needs: [gate, deploy, rollback]
    if: ${{ always() && (needs.gate.result != 'skipped' || needs.deploy.result != 'skipped' || needs.rollback.result != 'skipped') }}
    runs-on: ubuntu-latest
    env:
      OPERATION: ${{ inputs.rollback_to && '回滚' || (inputs.build_only && '构建验证' || '部署') }}
      VERSION: ${{ inputs.rollback_to || inputs.tag || github.ref_name }}
      RESULT: ${{ ((inputs.rollback_to && needs.rollback.result == 'success') || (!inputs.rollback_to && needs.gate.result == 'success' && needs.deploy.result == 'success')) && '成功' || '失败' }}
    steps:
      # SMTP_PASSWORD 没配时这里会失败，但不该覆盖门禁、部署或回滚结果
      - name: 发邮件
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: 73Info 部署 <${{ secrets.SMTP_FROM }}>
          to: ${{ secrets.SMTP_TO }}
          subject: "[73Info] user_client ${{ env.OPERATION }}${{ env.RESULT }} ${{ env.VERSION }}"
          body: |
            仓库：${{ github.repository }}
            站点：73info.cn
            操作：${{ env.OPERATION }}
            版本：${{ env.VERSION }}
            结果：${{ env.RESULT }}
            门禁：${{ needs.gate.result }}
            部署：${{ needs.deploy.result }}
            回滚：${{ needs.rollback.result }}

            提交：${{ github.sha }}
            执行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
